group {
    groupbar {
        enabled = true
        font_size = 11
        font_weight_active = bold
        font_weight_inactive = normal

        gradients = true
        height = 28
        indicator_gap = 2
        indicator_height = 3

        render_titles = true
        text_padding = 10
        text_offset = 0
        scrolling = true

        # Squircle rounding (M3 Expressive uses squircles)
        rounding = 10
        rounding_power = 4.0
        gradient_rounding = 10
        gradient_rounding_power = 4.0
        round_only_edges = false
        gradient_round_only_edges = false

        # M3 dark theme: primary container / surface variant
        text_color = 0xff1C1B1F          # on-primary (dark, for contrast on lit tab)
        text_color_inactive = 0xffCAC4D0 # on-surface-variant

        col.active = 0xffD0BCFF          # M3 primary container (purple)
        col.inactive = 0x552B2930        # surface container, subtle

        col.locked_active = 0xffFFB4AB   # M3 error container (warm red)
        col.locked_inactive = 0x55534341 # muted locked

        gaps_in = 3
        gaps_out = 5
        keep_upper_gap = false
        blur = true
    }
}

