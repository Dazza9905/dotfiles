[backdrop]
blur_intensity = 0.99999997764825821
tint_intensity = 0.44999998994171619

[bar]
order = [ "min-vertical" ]

    [bar.min-vertical]
    capsule = true
    capsule_fill = "on_secondary"
    capsule_foreground = "on_surface_variant"
    capsule_opacity = 0.0
    capsule_thickness = 0.80000000000000004
    center = []
    end = [ "tray", "keyboard_layout", "battery", "notifications" ]
    font_weight = 700
    margin_edge = 0
    margin_ends = 0
    padding = 4
    panel_overlap = 0
    position = "left"
    radius = 0
    radius_bottom_right = -80
    radius_top_right = -80
    shadow = false
    start = [ "control-center", "clock", "workspaces", "active_window" ]
    widget_spacing = 4

[brightness]
enable_ddcutil = true
minimum_brightness = 0.01

[calendar]
enabled = true
refresh_minutes = 5

    [calendar.account.home_nextcloud]
    color = "primary"
    name = "Personal"
    provider = "custom"
    server_url = "https://caldav.fastmail.com"
    type = "caldav"
    username = "darendrahos@fastmail.com"

[config]

[control_center]
sidebar = "full"
sidebar_section = "none"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hooks]
colors_changed = "sleep 2 && pkill -USR1 hx"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[keybinds]
cancel = [ "Escape" ]
down = [ "Down", "Alt+j" ]
left = [ "Left", "Alt+h" ]
right = [ "Right", "Alt+l" ]
tab_next = [ "tab" ]
tab_previous = [ "shift+tab", "iso_left_tab" ]
up = [ "Up", "Alt+k" ]
validate = [ "return", "kp_enter" ]

[location]
address = "Bratislava"

[lockscreen]
blur_intensity = 0.99999997764825821
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@Unknown-1",
    "lockscreen-login-box@DP-3",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001"
]

    [lockscreen_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@Unknown-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1920.0
    cy = 2041.0
    output = "Unknown-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Unknown-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 768.0
    cy = 841.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 768.0
    cy = 678.0
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

[notification]
layer = "overlay"

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/wallhaven", "noctalia/timer", "noctalia/kaomoji" ]

[shell]
lang = "en"
niri_overview_type_to_launch_enabled = true
offline_mode = false
password_style = "random"
screen_time_enabled = true
settings_show_advanced = true

    [shell.panel]
    borders = false
    control_center_placement = "floating"
    launcher_categories = false
    open_near_click_control_center = true
    open_near_click_launcher = true
    session_placement = "centered"
    shadow = false
    wallpaper_placement = "centered"

    [shell.screen_corners]
    enabled = true
    size = 30

    [shell.shadow]
    alpha = 0.0
    direction = "center"

[templates]

[theme]
builtin = "Catppuccin"
community_palette = "Mine"
custom_palette = "wallhaven-jx99mp-rb"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "helix", "kitty", "niri", "qt", "scroll", "starship", "sway" ]
    community_ids = [ "spicetify", "zen-browser", "neovim", "obsidian", "discord", "steam", "yazi" ]

[wallpaper]
edge_smoothness = 0.14999999999999999
transition = [ "disc", "fade", "stripes", "wipe", "zoom" ]
transition_duration = 1000
transition_on_startup = true

    [wallpaper.automation]
    order = "alphabetical"

    [wallpaper.default]
    path = "/home/dazza/Pictures/Wallpapers/wallhaven-2ex5m6.jpg"

    [wallpaper.last]
    path = "/home/dazza/Pictures/Wallpapers/wallhaven-2ex5m6.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/dazza/Pictures/Wallpapers/wallhaven-2ex5m6.jpg"

    [wallpaper.monitors.Unknown-1]
    path = "/home/dazza/Pictures/Wallpapers/wallhaven-2ex5m6.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/dazza/Pictures/Wallpapers/wallhaven_q2xq5d.jpg"

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.clock]
anchor = true
scale = 0.80000000000000004

[widget.media]
hide_when_no_media = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
capsule = true
labels_only_when_occupied = true
