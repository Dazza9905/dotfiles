# Global override configuration
# Using unbind followed by bindd to ensure priority

$terminal = uwsm-app -- xdg-terminal-exec

# Window Management
unbind = SUPER, Q
bindd = SUPER, Q, Kill active windows, killactive
unbind = SUPER, F
bindd = SUPER, F, Toggle fullscreen, fullscreen,
unbind = SUPER SHIFT, F
bindd = SUPER SHIFT, F, Toggle floating, togglefloating,
unbind = SUPER, semicolon
bindd = SUPER, semicolon, Toggle split, togglesplit,

# Focus (Vim motions)
unbind = SUPER, H
bindd = SUPER, H, Move focus left, movefocus, l
unbind = SUPER, L
bindd = SUPER, L, Move focus right, movefocus, r
unbind = SUPER, K
bindd = SUPER, K, Move focus up, movefocus, u
unbind = SUPER, J
bindd = SUPER, J, Move focus down, movefocus, d

# Swap (Vim motions)
unbind = SUPER SHIFT, H
bindd = SUPER SHIFT, H, Swap window to the left, swapwindow, l
unbind = SUPER SHIFT, L
bindd = SUPER SHIFT, L, Swap window to the right, swapwindow, r
unbind = SUPER SHIFT, K
bindd = SUPER SHIFT, K, Swap window up, swapwindow, u
unbind = SUPER SHIFT, J
bindd = SUPER SHIFT, J, Swap window down, swapwindow, d

# Move Window (Arrows)
unbind = SUPER, left
bindd = SUPER, left, Move window left, movewindow, l
unbind = SUPER, right
bindd = SUPER, right, Move window right, movewindow, r
unbind = SUPER, up
bindd = SUPER, up, Move window up, movewindow, u
unbind = SUPER, down
bindd = SUPER, down, Move window down, movewindow, d

# Switch workspaces with SUPER + [1-9; 0]
bindd = SUPER, code:10, Switch to workspace 1, workspace, 1
bindd = SUPER, code:11, Switch to workspace 2, workspace, 2
bindd = SUPER, code:12, Switch to workspace 3, workspace, 3
bindd = SUPER, code:13, Switch to workspace 4, workspace, 4
bindd = SUPER, code:14, Switch to workspace 5, workspace, 5
bindd = SUPER, code:15, Switch to workspace 6, workspace, 6
bindd = SUPER, code:16, Switch to workspace 7, workspace, 7
bindd = SUPER, code:17, Switch to workspace 8, workspace, 8
bindd = SUPER, code:18, Switch to workspace 9, workspace, 9
bindd = SUPER, code:19, Switch to workspace 10, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [1-9; 0]
bindd = SUPER SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10

# Move active window silently to a workspace with SUPER + SHIFT + ALT + [1-9; 0]
bindd = SUPER SHIFT ALT, code:10, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT ALT, code:11, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT ALT, code:12, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT ALT, code:13, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT ALT, code:14, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT ALT, code:15, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT ALT, code:16, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT ALT, code:17, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT ALT, code:18, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT ALT, code:19, Move window silently to workspace 10, movetoworkspacesilent, 10






# Applications & Shell
# unbind = SUPER, RETURN
# bind = SUPER, RETURN, exec, kitty
unbind = SUPER, E
bindd = SUPER, E, Yazi, exec, kitty -e fish -c "y"
unbind = SUPER SHIFT, E
bindd = SUPER SHIFT, E, File manager, exec, uwsm-app -- nautilus --new-window

# Media control: J (Prev), K (Play/Pause), L (Next)
bindl = ALT, J, exec, playerctl previous
bindl = ALT, K, exec, playerctl play-pause
bindl = ALT, L, exec, playerctl next


ubind = Ctrl+Alt, Delete
bindd = SUPER, Escape , Toggle session menu, global, quickshell:sessionToggle # Toggle session menu
bindd = SUPER SHIFT, escape, Lock, exec, loginctl lock-session # Lock

unbind = SUPER, B
bindd = SUPER, B, Browser, exec, zen-browser
unbind = SUPER SHIFT, B
bindd = SUPER SHIFT, B, Browser (private), exec, zen-browser --private-window

unbind = SUPER, M
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
unbind = SUPER SHIFT, M
bindd = SUPER SHIFT, M, Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"

unbind = SUPER, N
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
unbind = SUPER SHIFT, N
bindd = SUPER SHIFT, N, Xournalpp, exec, uwsm-app -- env GDK_BACKEND=x11 xournalpp

unbind = SUPER, D
bindd = SUPER, D, Discord, exec, uwsm-app -- vesktop
unbind = SUPER SHIFT, D
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker

unbind = SUPER, SLASH
bindd = SUPER, SLASH, Passwords, exec, $terminal --class bw-quicksearch -t "Bitwarden Quick Search" -o window.dimensions.columns=60 -o window.dimensions.lines=12 -e ~/.local/bin/bw-quicksearch
unbind = SUPER SHIFT, SLASH
bindd = SUPER SHIFT, SLASH, Bitwarden Desktop, exec, uwsm-app -- bitwarden-desktop

# System & Utilities
unbind = SUPER, W
bindd = SUPER, W, WiFi, exec, uwsm-app -- omarchy-launch-wifi
unbind = SUPER, S
bindd = SUPER, S, Sound, exec, uwsm-app -- xdg-terminal-exec --app-id=com.omarchy.Wiremix -e wiremix
unbind = SUPER, T
bindd = SUPER, T, Activity, exec, omarchy-launch-tui btop

unbind = SUPER, P
bindd = SUPER, P, Powersave, exec, omarchy-launch-tui auto-cpufreq --force powersave
unbind = SUPER SHIFT, P
bindd = SUPER SHIFT, P, Performance, exec, omarchy-launch-tui auto-cpufreq --force performance

unbind = SUPER, C
bindd = SUPER, C, Calculator, exec, gnome-calculator
unbind = SUPER SHIFT, C
bindd = SUPER SHIFT, C, Color picking, exec, pkill hyprpicker || hyprpicker -a

unbind = SUPER, F10
bindd = SUPER, F10, Toggle touchpad, exec, ~/.local/bin/touchpad-toggle

# Screenshots
unbind = SUPER, F6
bindd = SUPER, F6, Screenshot, exec, omarchy-cmd-screenshot
unbind = SUPER SHIFT, F6
bindd = SUPER SHIFT, F6, Screenshot Clipboard, exec, omarchy-cmd-screenshot smart clipboard
unbind = SUPER SHIFT, S
bindd = SUPER SHIFT, S, Screenshot Clipboard (S), exec, omarchy-cmd-screenshot smart clipboard

# Special Workspace (Magic)
# unbind = SUPER SHIFT, Q
# bindd = SUPER SHIFT, Q, Toggle Magic Workspace, togglespecialworkspace, magic
# Note: Adding multiple actions to one key requires separate bindd lines
# bindd = SUPER SHIFT, Q, Move to Magic, movetoworkspace, special:magic
